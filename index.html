<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAC - Relatório de Atendimento ao Cliente</title>
    <!-- Firebase SDK (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary-color: #00778f;
            --border-color: #333;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
            color: #000;
        }
        .screen {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .screen.active {
            display: block;
        }
        /* Tela Inicial */
        #home-screen {
            text-align: center;
            padding: 50px 20px;
        }
        .home-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px;
            font-size: 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .home-btn:hover {
            opacity: 0.9;
        }

        /* Documento RAC Layout Exato do Word */
        .rac-container {
            border: 1px solid var(--border-color);
            padding: 15px;
            background: #fff;
        }
        .rac-header, .rac-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .rac-footer {
            border-bottom: none;
            border-top: 2px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
        }
        h2.rac-title {
            text-align: center;
            font-size: 16px;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section-title {
            background-color: #ddd !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            font-weight: bold;
            padding: 4px 8px;
            margin-top: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            border: 1px solid #bbb;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            margin-bottom: 2px;
            font-size: 12px;
        }
        input[type="text"], input[type="tel"], input[type="date"], input[type="time"], select, textarea {
            padding: 6px;
            border: 1px solid #777;
            border-radius: 3px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            height: 50px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 4px;
        }
        
        /* Botão de Assinatura no Formulário */
        .btn-open-sig {
            background-color: #f8f9fa;
            border: 1px dashed #00778f;
            color: #00778f;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .btn-open-sig:hover {
            background-color: #e2f0f3;
        }
        #sig-preview-container {
            text-align: center;
            border: 1px solid #ccc;
            background: #fafafa;
            padding: 5px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #sig-preview-container img {
            max-height: 45px;
            max-width: 100%;
            margin-top: 2px;
        }
        .sig-info-text {
            font-size: 11px;
            font-weight: bold;
            color: #333;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        /* Modal / Tela de Assinatura em Tela Cheia */
        #signature-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        .signature-box {
            background: #fff;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .signature-canvas-wrapper {
            border: 2px dashed #777;
            background: #fff;
            height: 250px;
            margin: 15px 0;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        /* Botões de Ação */
        .action-bar {
            margin-top: 20px;
            text-align: center;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-pdf { background-color: #00778f; color: white; display: none; }
        .btn-whatsapp { background-color: #25d366; color: white; display: none; }
        .btn-back { background-color: #6c757d; color: white; }
        
        /* Lista de Fichas Salvas */
        .saved-item {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* CONFIGURAÇÃO EXATA PARA IMPRESSÃO / PDF */
        @media print {
            body * {
                visibility: hidden;
            }
            #pdf-content, #pdf-content * {
                visibility: visible;
            }
            #pdf-content {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none;
                padding: 0;
            }
            .btn-open-sig {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- MODAL DE ASSINATURA -->
    <div id="signature-modal">
        <div class="signature-box">
            <h3 style="margin-top:0; color:#00778f;">Assinatura do Responsável</h3>
            <p style="font-size:12px; color:#666; margin:5px 0;">Faça a assinatura no quadro abaixo:</p>
            <div class="signature-canvas-wrapper">
                <canvas id="sig-canvas"></canvas>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-action" style="background-color: #6c757d; color: white;" onclick="closeSignatureModal()">Cancelar</button>
                <button type="button" class="btn-action" style="background-color: #ffc107; color: black;" onclick="clearSignatureCanvas()">Limpar</button>
                <button type="button" class="btn-action btn-save" onclick="saveSignatureCanvas()">Confirmar Assinatura</button>
            </div>
        </div>
    </div>

    <!-- 1. TELA INICIAL -->
    <div id="home-screen" class="screen active">
        <h1>BRMobility</h1>
        <p>Relatório de Atendimento ao Cliente (RAC)</p>
        <button class="home-btn" onclick="openNewForm()">Nova Ficha (RAC) de atendimento</button>
        <button class="home-btn" style="background-color: #555;" onclick="openSavedList()">Fichas (RAC) Salvas</button>
    </div>

    <!-- 2. TELA DE NOVA FICHA (RAC) -->
    <div id="form-screen" class="screen">
        <div id="pdf-content" class="rac-container">
            <div class="rac-header">
                <h3 style="margin: 0; color: #00778f; font-size: 16px;">BRMobility</h3>
                <h2 class="rac-title">RELATÓRIO DE ATENDIMENTO AO CLIENTE</h2>
            </div>

            <form id="rac-form" onsubmit="return false;">
                <div class="section-title">INFORMAÇÕES</div>
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label>Cliente:</label>
                        <input type="text" id="cliente" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Nº Chamado:</label>
                        <input type="tel" id="num_chamado" pattern="[0-9]*" inputmode="numeric" required placeholder="Ex: 02568">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Data de abertura:</label>
                        <input type="tel" id="data_abertura" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label>Data de atendimento:</label>
                        <input type="date" id="data_atendimento" required readonly>
                    </div>
                    <div class="form-group">
                        <label>Horário de atendimento:</label>
                        <input type="time" id="horario_atendimento" required readonly>
                    </div>
                </div>

                <div class="section-title">ATENDIMENTO</div>
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label>Responsável no atendimento:</label>
                        <input type="text" id="responsavel" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Contato do responsável:</label>
                        <input type="tel" id="contato_responsavel" inputmode="numeric" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Modelo veículo(s):</label>
                        <select id="modelo_veiculos" required>
                            <option value="">Selecione o modelo</option>
                            <option value="i2">i2</option>
                            <option value="X2">X2</option>
                            <option value="i3">i3</option>
                            <option value="X3">X3</option>
                            <option value="S1">S1</option>
                            <option value="S6">S6</option>
                            <option value="S8">S8</option>
                            <option value="R8">R8</option>
                            <option value="BR8">BR8</option>
                            <option value="S9">S9</option>
                            <option value="S9X">S9X</option>
                            <option value="H9">H9</option>
                            <option value="H9X">H9X</option>
                            <option value="S10">S10</option>
                            <option value="S10X">S10X</option>
                            <option value="VIP">VIP</option>
                            <option value="VIPS">VIPS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nº de Patrimônio:</label>
                        <input type="tel" id="num_patrimonio" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label>Utilização:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="utilizacao" value="interna" required> interna</label>
                            <label><input type="radio" name="utilizacao" value="externa" required> externa</label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Solicitação:</label>
                        <textarea id="solicitacao" required></textarea>
                    </div>
                </div>

                <div class="section-title">OBSERVAÇÕES</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Veículo(s) saindo:</label>
                        <input type="text" id="veiculos_saindo" required>
                    </div>
                    <div class="form-group">
                        <label>Veículo(s) entrando:</label>
                        <input type="text" id="veiculos_entrando" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Observações gerais:</label>
                        <textarea id="observacoes" required></textarea>
                    </div>
                </div>

                <div class="rac-footer">
                    <div class="form-group">
                        <label>Colaborador BRMobility</label>
                        <input type="text" id="colaborador_brmobility" value="Téc. Externo Brandon de Freitas" readonly>
                    </div>
                    <div class="form-group">
                        <label>Assinatura do Responsável</label>
                        <div class="btn-open-sig" onclick="openSignatureModal()">Toque para Assinar</div>
                        <div id="sig-preview-container">
                            <span style="color: #888; font-size: 11px;" id="sig-status-text">Nenhuma assinatura</span>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="action-bar">
            <button class="btn-action btn-back" onclick="showScreen('home-screen')">Voltar</button>
            <button class="btn-action btn-save" id="btn-salvar" onclick="salvarFicha()">Salvar Ficha</button>
            <button class="btn-action btn-pdf" id="btn-pdf" onclick="gerarPDF()">Download da Ficha (PDF)</button>
            <button class="btn-action btn-whatsapp" id="btn-whatsapp" onclick="enviarWhatsApp()">WhatsApp Operacional</button>
        </div>
    </div>

    <!-- 3. TELA DE FICHAS SALVAS -->
    <div id="saved-screen" class="screen">
        <h2>Fichas (RAC) Salvas</h2>
        <div id="saved-list-container">
            <p>Buscando fichas...</p>
        </div>
        <div class="action-bar" style="margin-top: 20px;">
            <button class="btn-action btn-back" onclick="showScreen('home-screen')">Voltar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC133WKh3TTltm_47wu3HWoOgv5Vp2HnXQ",
            authDomain: "rac-tec-externo-atendimentos.firebaseapp.com",
            projectId: "rac-tec-externo-atendimentos",
            storageBucket: "rac-tec-externo-atendimentos.firebasestorage.app",
            messagingSenderId: "205160325304",
            appId: "1:205160325304:web:4aea4c45ed2c17d454d44d",
            measurementId: "G-NP08J9LGP1"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let canvas, ctx, painting = false;
        let currentSignatureData = "";
        let currentSavedData = null;

        document.addEventListener("DOMContentLoaded", () => {
            initSignaturePad();
            setupAutoDateTime();
            setupDateMask();
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openNewForm() {
            document.getElementById('rac-form').reset();
            document.getElementById('colaborador_brmobility').value = "Téc. Externo Brandon de Freitas";
            setupAutoDateTime();
            clearSignatureData();
            currentSavedData = null;
            document.getElementById('btn-pdf').style.display = 'none';
            document.getElementById('btn-whatsapp').style.display = 'none';
            showScreen('form-screen');
        }

        function setupAutoDateTime() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('data_atendimento').value = `${yyyy}-${mm}-${dd}`;
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('horario_atendimento').value = `${hours}:${minutes}`;
        }

        function setupDateMask() {
            const inputData = document.getElementById('data_abertura');
            inputData.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 8) value = value.slice(0, 8);
                
                if (value.length > 4) {
                    value = value.replace(/^(\d{2})(\d{2})(\d{0,4})/, '$1/$2/$3');
                } else if (value.length > 2) {
                    value = value.replace(/^(\d{2})(\d{0,2})/, '$1/$2');
                }
                e.target.value = value;
            });
        }

        function initSignaturePad() {
            canvas = document.getElementById('sig-canvas');
            ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startPosition = (e) => {
                painting = true;
                draw(e);
            };
            const finishedPosition = () => {
                painting = false;
                ctx.beginPath();
            };
            const draw = (e) => {
                if (!painting) return;
                e.preventDefault();
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000';

                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', finishedPosition);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('touchstart', startPosition, { passive: false });
            canvas.addEventListener('touchend', finishedPosition);
            canvas.addEventListener('touchmove', draw, { passive: false });
        }

        function openSignatureModal() {
            document.getElementById('signature-modal').style.display = 'flex';
            setTimeout(() => {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                if (currentSignatureData) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = currentSignatureData;
                }
            }, 50);
        }

        function closeSignatureModal() {
            document.getElementById('signature-modal').style.display = 'none';
        }

        function clearSignatureCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function saveSignatureCanvas() {
            const blank = document.createElement('canvas');
            blank.width = canvas.width;
            blank.height = canvas.height;
            if (canvas.toDataURL() === blank.toDataURL()) {
                alert("Por favor, faça a assinatura antes de confirmar.");
                return;
            }

            currentSignatureData = canvas.toDataURL('image/png');
            atualizarPreviewAssinatura();
            closeSignatureModal();
        }

        function atualizarPreviewAssinatura() {
            const nomeResp = document.getElementById('responsavel').value.trim() || "Responsável";
            const contatoResp = document.getElementById('contato_responsavel').value.trim();
            const previewContainer = document.getElementById('sig-preview-container');
            
            let infoHtml = `<div class="sig-info-text">${nomeResp}`;
            if (contatoResp) {
                infoHtml += ` - Tel: ${contatoResp}`;
            }
            infoHtml += `</div>`;

            previewContainer.innerHTML = infoHtml + `<img src="${currentSignatureData}" alt="Assinatura">`;
        }

        function clearSignatureData() {
            currentSignatureData = "";
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('sig-preview-container').innerHTML = `<span style="color: #888; font-size: 11px;" id="sig-status-text">Nenhuma assinatura</span>`;
        }

        async function salvarFicha() {
            const form = document.getElementById('rac-form');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            if (!currentSignatureData) {
                alert("A assinatura do responsável é obrigatória.");
                openSignatureModal();
                return;
            }

            const btnSalvar = document.getElementById('btn-salvar');
            btnSalvar.innerText = "Salvando...";
            btnSalvar.disabled = true;

            try {
                let rawChamado = document.getElementById('num_chamado').value.trim();
                let numChamadoFormatado = rawChamado.startsWith('#') ? rawChamado : '#' + rawChamado.replace(/[^0-9]/g, '');

                const utilizacaoEl = document.querySelector('input[name="utilizacao"]:checked');

                const formData = {
                    cliente: document.getElementById('cliente').value,
                    num_chamado: numChamadoFormatado,
                    data_abertura: document.getElementById('data_abertura').value,
                    data_atendimento: document.getElementById('data_atendimento').value,
                    horario_atendimento: document.getElementById('horario_atendimento').value,
                    responsavel: document.getElementById('responsavel').value,
                    contato_responsavel: document.getElementById('contato_responsavel').value,
                    modelo_veiculos: document.getElementById('modelo_veiculos').value,
                    num_patrimonio: document.getElementById('num_patrimonio').value,
                    utilizacao: utilizacaoEl ? utilizacaoEl.value : '',
                    solicitacao: document.getElementById('solicitacao').value,
                    veiculos_saindo: document.getElementById('veiculos_saindo').value,
                    veiculos_entrando: document.getElementById('veiculos_entrando').value,
                    observacoes: document.getElementById('observacoes').value,
                    colaborador_brmobility: document.getElementById('colaborador_brmobility').value,
                    assinatura_responsavel: currentSignatureData,
                    createdAt: new Date().toISOString()
                };

                const docRef = await db.collection("fichas_rac").add(formData);
                formData.id = docRef.id;
                currentSavedData = formData;

                alert("Ficha salva com sucesso!");
                document.getElementById('btn-pdf').style.display = 'inline-block';
                document.getElementById('btn-whatsapp').style.display = 'inline-block';
            } catch (error) {
                console.error("Erro ao salvar: ", error);
                alert("Erro ao salvar a ficha. Verifique a conexão.");
            } finally {
                btnSalvar.innerText = "Salvar Ficha";
                btnSalvar.disabled = false;
            }
        }

        function gerarPDF() {
            window.print();
        }

        function enviarWhatsApp() {
            if (!currentSavedData) {
                alert("Por favor, salve a ficha primeiro antes de enviar.");
                return;
            }

            const d = currentSavedData;
            let textoRelatorio = `*RELATÓRIO DE ATENDIMENTO AO CLIENTE (RAC)*\n\n` +
                `*INFORMAÇÕES*\n` +
                `Cliente: ${d.cliente}\n` +
                `Nº Chamado: ${d.num_chamado}\n` +
                `Data de abertura: ${d.data_abertura}\n` +
                `Data de atendimento: ${d.data_atendimento}\n` +
                `Horário de atendimento: ${d.horario_atendimento}\n\n` +
                `*ATENDIMENTO*\n` +
                `Responsável no atendimento: ${d.responsavel}\n` +
                `Contato do responsável: ${d.contato_responsavel}\n` +
                `Modelo veículo(s): ${d.modelo_veiculos}\n` +
                `Nº de Patrimônio: ${d.num_patrimonio}\n` +
                `Utilização: ${d.utilizacao}\n` +
                `Solicitação: ${d.solicitacao}\n\n` +
                `*OBSERVAÇÕES*\n` +
                `Veículo(s) saindo: ${d.veiculos_saindo}\n` +
                `Veículo(s) entrando: ${d.veiculos_entrando}\n` +
                `Observações: ${d.observacoes}\n\n` +
                `Colaborador BRMobility: ${d.colaborador_brmobility}\n` +
                `Responsável Assinatura: ${d.responsavel} (${d.contato_responsavel})`;

            const encodedText = encodeURIComponent(textoRelatorio);
            window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
        }

        async function openSavedList() {
            showScreen('saved-screen');
            const container = document.getElementById('saved-list-container');
            container.innerHTML = "<p>Buscando fichas...</p>";

            try {
                const snapshot = await db.collection("fichas_rac").orderBy("createdAt", "desc").get();
                if (snapshot.empty) {
                    container.innerHTML = "<p>Nenhuma ficha salva encontrada.</p>";
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="saved-item">
                            <div>
                                <strong>Chamado:</strong> ${data.num_chamado} | <strong>Cliente:</strong> ${data.cliente}<br>
                                <small>Data: ${data.data_atendimento} - ${data.horario_atendimento}</small>
                            </div>
                            <button class="btn-action btn-save" style="padding: 5px 10px; font-size: 12px;" onclick='recarregarFicha(${JSON.stringify(data)})'>Visualizar/Baixar</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error("Erro ao carregar fichas:", error);
                container.innerHTML = "<p>Erro ao carregar fichas salvas.</p>";
            }
        }

        function recarregarFicha(data) {
            currentSavedData = data;
            document.getElementById('cliente').value = data.cliente || '';
            document.getElementById('num_chamado').value = data.num_chamado || '';
            document.getElementById('data_abertura').value = data.data_abertura || '';
            document.getElementById('data_atendimento').value = data.data_atendimento || '';
            document.getElementById('horario_atendimento').value = data.horario_atendimento || '';
            document.getElementById('responsavel').value = data.responsavel || '';
            document.getElementById('contato_responsavel').value = data.contato_responsavel || '';
            document.getElementById('modelo_veiculos').value = data.modelo_veiculos || '';
            document.getElementById('num_patrimonio').value = data.num_patrimonio || '';
            
            if (data.utilizacao) {
                const radio = document.querySelector(`input[name="utilizacao"][value="${data.utilizacao}"]`);
                if (radio) radio.checked = true;
            }
            
            document.getElementById('solicitacao').value = data.solicitacao || '';
            document.getElementById('veiculos_saindo').value = data.veiculos_saindo || '';
            document.getElementById('veiculos_entrando').value = data.veiculos_entrando || '';
            document.getElementById('observacoes').value = data.observacoes || '';
            document.getElementById('colaborador_brmobility').value = data.colaborador_brmobility || '';

            if (data.assinatura_responsavel) {
                currentSignatureData = data.assinatura_responsavel;
                atualizarPreviewAssinatura();
            } else {
                clearSignatureData();
            }

            showScreen('form-screen');
            document.getElementById('btn-pdf').style.display = 'inline-block';
            document.getElementById('btn-whatsapp').style.display = 'inline-block';
        }
    </script>
</body>
</html>
