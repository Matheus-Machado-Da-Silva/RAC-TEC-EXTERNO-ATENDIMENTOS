<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAC - Relatório de Atendimento ao Cliente</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
    
    <style>
        :root {
            --primary-color: #00778f;
            --border-color: #333;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
            color: #000;
        }
        .screen {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen.active {
            display: block;
        }
        #home-screen {
            text-align: center;
            padding: 50px 20px;
        }
        .home-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px;
            font-size: 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .rac-container {
            border: 1px solid var(--border-color);
            padding: 15px;
            background: #fff;
        }
        .rac-header, .rac-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .rac-footer {
            border-bottom: none;
            border-top: 2px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            flex-direction: column;
            align-items: stretch;
        }
        h2.rac-title {
            text-align: center;
            font-size: 16px;
            margin: 10px 0;
            text-transform: uppercase;
        }
        .section-title {
            background-color: #ddd;
            font-weight: bold;
            padding: 4px 8px;
            margin-top: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            border: 1px solid #bbb;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            margin-bottom: 2px;
            font-size: 12px;
        }
        input[type="text"], input[type="tel"], input[type="date"], input[type="time"], select, textarea {
            padding: 6px;
            border: 1px solid #777;
            border-radius: 3px;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 4px;
        }
        
        /* Modal Tela Cheia de Assinatura Otimizado para Celular */
        #signature-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 99999;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
        }
        #signature-modal.active {
            display: flex;
        }
        .sig-modal-header {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            padding: 5px 0;
            color: #333;
        }
        .sig-canvas-box {
            width: 100%;
            height: 70vh;
            border: 2px dashed #00778f;
            background: #fafafa;
            position: relative;
            box-sizing: border-box;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }
        .sig-modal-footer {
            display: flex;
            gap: 10px;
            padding: 5px 0;
        }
        .sig-preview-box {
            border: 1px solid #777;
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 5px;
        }
        .sig-preview-box img {
            max-height: 50px;
            max-width: 100%;
        }

        .media-section {
            margin-top: 15px;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
        .action-bar {
            margin-top: 20px;
            text-align: center;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-whatsapp { background-color: #25d366; color: white; display: none; }
        .btn-back { background-color: #6c757d; color: white; }
        
        .saved-item {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 1. TELA INICIAL -->
    <div id="home-screen" class="screen active">
        <h2>BRMobility</h2>
        <p>Relatório de Atendimento ao Cliente (RAC)</p>
        <button class="home-btn" onclick="openNewForm()">Nova Ficha (RAC) de atendimento</button>
        <button class="home-btn" style="background-color: #555;" onclick="openSavedList()">Fichas (RAC) Salvas</button>
    </div>

    <!-- 2. TELA DE NOVA FICHA (RAC) -->
    <div id="form-screen" class="screen">
        <div class="rac-container">
            <div class="rac-header">
                <h2 class="rac-title" style="width:100%;">RELATÓRIO DE ATENDIMENTO AO CLIENTE</h2>
            </div>

            <form id="rac-form" onsubmit="return false;">
                <div class="section-title">INFORMAÇÕES</div>
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label>Cliente:</label>
                        <input type="text" id="cliente" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Nº Chamado:</label>
                        <input type="tel" id="num_chamado" pattern="[0-9]*" inputmode="numeric" required placeholder="Ex: 02568">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Data de abertura:</label>
                        <input type="tel" id="data_abertura" inputmode="numeric" placeholder="DD/MM/AAAA" required>
                    </div>
                    <div class="form-group">
                        <label>Data de atendimento:</label>
                        <input type="date" id="data_atendimento" required readonly>
                    </div>
                    <div class="form-group">
                        <label>Horário de atendimento:</label>
                        <input type="time" id="horario_atendimento" required readonly>
                    </div>
                </div>

                <div class="section-title">ATENDIMENTO</div>
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label>Responsável no atendimento:</label>
                        <input type="text" id="responsavel" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Contato do responsável:</label>
                        <input type="tel" id="contato_responsavel" inputmode="numeric" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Modelo veículo(s):</label>
                        <select id="modelo_veiculos" required>
                            <option value="">Selecione o modelo</option>
                            <option value="i2">i2</option><option value="X2">X2</option>
                            <option value="i3">i3</option><option value="X3">X3</option>
                            <option value="S1">S1</option><option value="S6">S6</option>
                            <option value="S8">S8</option><option value="R8">R8</option>
                            <option value="BR8">BR8</option><option value="S9">S9</option>
                            <option value="S9X">S9X</option><option value="H9">H9</option>
                            <option value="H9X">H9X</option><option value="S10">S10</option>
                            <option value="S10X">S10X</option><option value="VIP">VIP</option>
                            <option value="VIPS">VIPS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nº de Patrimônio:</label>
                        <input type="tel" id="num_patrimonio" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label>Utilização:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="utilizacao" value="interna" required> interna</label>
                            <label><input type="radio" name="utilizacao" value="externa" required> externa</label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Solicitação:</label>
                        <textarea id="solicitacao" required></textarea>
                    </div>
                </div>

                <div class="section-title">OBSERVAÇÕES</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Veículo(s) saindo:</label>
                        <input type="text" id="veiculos_saindo" required>
                    </div>
                    <div class="form-group">
                        <label>Veículo(s) entrando:</label>
                        <input type="text" id="veiculos_entrando" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Observações gerais:</label>
                        <textarea id="observacoes" required></textarea>
                    </div>
                </div>

                <div class="media-section">
                    <div class="form-group">
                        <label>Fotos (Mínimo 1, Máximo 5 obrigatórias):</label>
                        <input type="file" id="input-fotos" accept="image/*" multiple capture="environment">
                        <small id="foto-contador" style="color: #666; margin-top: 3px;">Nenhuma foto selecionada</small>
                    </div>
                    <div class="form-group" style="margin-top: 10px;">
                        <label>Vídeo (Opcional):</label>
                        <input type="file" id="input-video" accept="video/*" capture="environment">
                    </div>
                </div>

                <div class="rac-footer">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label>Colaborador BRMobility</label>
                        <input type="text" id="colaborador_brmobility" value="Téc. Externo Brandon de Freitas" readonly>
                    </div>
                    <div class="form-group">
                        <label>Assinatura do Responsável</label>
                        <div class="sig-preview-box" onclick="openSignatureModal()">
                            <span id="sig-placeholder-text" style="color: #666; font-size: 12px;">Toque aqui para assinar</span>
                            <img id="sig-preview-img" style="display:none;" alt="Assinatura">
                        </div>
                    </div>
                </div>
            </form>

            <div class="action-bar">
                <button class="btn-action btn-back" onclick="showScreen('home-screen')">Voltar</button>
                <button class="btn-action btn-save" id="btn-salvar" onclick="salvarFicha()">Salvar Ficha</button>
                <button class="btn-action btn-whatsapp" id="btn-whatsapp" onclick="enviarWhatsApp()">WhatsApp Operacional</button>
            </div>
        </div>
    </div>

    <!-- MODAL TELA CHEIA DE ASSINATURA OTIMIZADO -->
    <div id="signature-modal">
        <div class="sig-modal-header">Assine no espaço abaixo e clique em Concluir</div>
        <div class="sig-canvas-box">
            <canvas id="sig-canvas"></canvas>
        </div>
        <div class="sig-modal-footer">
            <button class="btn-action" style="background:#dc3545; color:white; flex:1;" onclick="clearSignatureModal()">Limpar</button>
            <button class="btn-action btn-save" style="flex:1;" onclick="saveSignatureModal()">Concluir Assinatura</button>
        </div>
    </div>

    <!-- 3. TELA DE FICHAS SALVAS -->
    <div id="saved-screen" class="screen">
        <h2>Fichas (RAC) Salvas</h2>
        <div id="saved-list-container">
            <p>Carregando fichas...</p>
        </div>
        <div class="action-bar" style="margin-top: 20px;">
            <button class="btn-action btn-back" onclick="showScreen('home-screen')">Voltar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC133WKh3TTltm_47wu3HWoOgv5Vp2HnXQ",
            authDomain: "rac-tec-externo-atendimentos.firebaseapp.com",
            projectId: "rac-tec-externo-atendimentos",
            storageBucket: "rac-tec-externo-atendimentos.firebasestorage.app",
            messagingSenderId: "205160325304",
            appId: "1:205160325304:web:4aea4c45ed2c17d454d44d",
            measurementId: "G-NP08J9LGP1"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const storage = firebase.storage();

        let modalCanvas, modalCtx, painting = false;
        let selectedPhotos = [];
        let selectedVideo = null;
        let currentSavedData = null;
        let signatureDataUrl = "";

        document.addEventListener("DOMContentLoaded", () => {
            initModalSignaturePad();
            setupAutoDateTime();
            setupPhotoValidation();
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openNewForm() {
            document.getElementById('rac-form').reset();
            document.getElementById('colaborador_brmobility').value = "Téc. Externo Brandon de Freitas";
            setupAutoDateTime();
            clearSignatureModal();
            selectedPhotos = [];
            selectedVideo = null;
            signatureDataUrl = "";
            document.getElementById('sig-preview-img').style.display = 'none';
            document.getElementById('sig-placeholder-text').style.display = 'block';
            document.getElementById('foto-contador').innerText = "Nenhuma foto selecionada";
            document.getElementById('btn-whatsapp').style.display = 'none';
            showScreen('form-screen');
        }

        function setupAutoDateTime() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            document.getElementById('data_atendimento').value = `${yyyy}-${mm}-${dd}`;
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('horario_atendimento').value = `${hours}:${minutes}`;
        }

        function initModalSignaturePad() {
            modalCanvas = document.getElementById('sig-canvas');
            modalCtx = modalCanvas.getContext('2d');
            
            const getPos = (e) => {
                const rect = modalCanvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startPosition = (e) => { painting = true; draw(e); };
            const finishedPosition = () => { painting = false; modalCtx.beginPath(); };
            const draw = (e) => {
                if (!painting) return;
                e.preventDefault();
                modalCtx.lineWidth = 3;
                modalCtx.lineCap = 'round';
                modalCtx.strokeStyle = '#000';
                const pos = getPos(e);
                modalCtx.lineTo(pos.x, pos.y);
                modalCtx.stroke();
                modalCtx.beginPath();
                modalCtx.moveTo(pos.x, pos.y);
            };

            modalCanvas.addEventListener('mousedown', startPosition);
            modalCanvas.addEventListener('mouseup', finishedPosition);
            modalCanvas.addEventListener('mousemove', draw);
            modalCanvas.addEventListener('touchstart', startPosition, { passive: false });
            modalCanvas.addEventListener('touchend', finishedPosition);
            modalCanvas.addEventListener('touchmove', draw, { passive: false });
        }

        function openSignatureModal() {
            document.getElementById('signature-modal').classList.add('active');
            setTimeout(() => {
                const rect = modalCanvas.getBoundingClientRect();
                modalCanvas.width = rect.width;
                modalCanvas.height = rect.height;
            }, 100);
        }

        function clearSignatureModal() {
            if(modalCtx) modalCtx.clearRect(0, 0, modalCanvas.width, modalCanvas.height);
        }

        function saveSignatureModal() {
            signatureDataUrl = modalCanvas.toDataURL('image/png');
            const previewImg = document.getElementById('sig-preview-img');
            previewImg.src = signatureDataUrl;
            previewImg.style.display = 'block';
            document.getElementById('sig-placeholder-text').style.display = 'none';
            document.getElementById('signature-modal').classList.remove('active');
        }

        function setupPhotoValidation() {
            document.getElementById('input-fotos').addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                if (files.length < 1 || files.length > 5) {
                    alert("Selecione no mínimo 1 e no máximo 5 fotos.");
                    e.target.value = "";
                    selectedPhotos = [];
                    document.getElementById('foto-contador').innerText = "Nenhuma foto selecionada";
                    return;
                }
                selectedPhotos = files;
                document.getElementById('foto-contador').innerText = `${files.length} foto(s) selecionada(s).`;
            });

            document.getElementById('input-video').addEventListener('change', (e) => {
                selectedVideo = e.target.files[0] || null;
            });
        }

        async function salvarFicha() {
            const form = document.getElementById('rac-form');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            if (selectedPhotos.length < 1 || selectedPhotos.length > 5) {
                alert("É necessário anexar de 1 a 5 fotos.");
                return;
            }

            if (!signatureDataUrl) {
                alert("Por favor, colete a assinatura do responsável.");
                return;
            }

            const btnSalvar = document.getElementById('btn-salvar');
            btnSalvar.innerText = "Salvando...";
            btnSalvar.disabled = true;

            try {
                let rawChamado = document.getElementById('num_chamado').value.trim();
                let numChamadoFormatado = rawChamado.startsWith('#') ? rawChamado : '#' + rawChamado.replace(/[^0-9]/g, '');
                const utilizacaoEl = document.querySelector('input[name="utilizacao"]:checked');

                const formData = {
                    cliente: document.getElementById('cliente').value,
                    num_chamado: numChamadoFormatado,
                    data_abertura: document.getElementById('data_abertura').value,
                    data_atendimento: document.getElementById('data_atendimento').value,
                    horario_atendimento: document.getElementById('horario_atendimento').value,
                    responsavel: document.getElementById('responsavel').value,
                    contato_responsavel: document.getElementById('contato_responsavel').value,
                    modelo_veiculos: document.getElementById('modelo_veiculos').value,
                    num_patrimonio: document.getElementById('num_patrimonio').value,
                    utilizacao: utilizacaoEl ? utilizacaoEl.value : '',
                    solicitacao: document.getElementById('solicitacao').value,
                    veiculos_saindo: document.getElementById('veiculos_saindo').value,
                    veiculos_entrando: document.getElementById('veiculos_entrando').value,
                    observacoes: document.getElementById('observacoes').value,
                    colaborador_brmobility: document.getElementById('colaborador_brmobility').value,
                    assinatura_responsavel: signatureDataUrl,
                    createdAt: new Date().toISOString()
                };

                let photoUrls = [];
                for (let i = 0; i < selectedPhotos.length; i++) {
                    const file = selectedPhotos[i];
                    const storageRef = storage.ref(`rac_media/${Date.now()}_foto_${i}_${file.name}`);
                    const snapshot = await storageRef.put(file);
                    const downloadUrl = await snapshot.ref.getDownloadURL();
                    photoUrls.push(downloadUrl);
                }
                formData.photos = photoUrls;

                let videoUrl = "";
                if (selectedVideo) {
                    const videoRef = storage.ref(`rac_media/${Date.now()}_video_${selectedVideo.name}`);
                    const videoSnapshot = await videoRef.put(selectedVideo);
                    videoUrl = await videoSnapshot.ref.getDownloadURL();
                }
                formData.video = videoUrl;

                const docRef = await db.collection("fichas_rac").add(formData);
                formData.id = docRef.id;
                currentSavedData = formData;

                alert("Ficha salva com sucesso!");
                document.getElementById('btn-whatsapp').style.display = 'inline-block';
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar. Verifique se as Regras do Firestore/Storage estão públicas.");
            } finally {
                btnSalvar.innerText = "Salvar Ficha";
                btnSalvar.disabled = false;
            }
        }

        function enviarWhatsApp() {
            if (!currentSavedData) {
                alert("Salve a ficha primeiro.");
                return;
            }

            const d = currentSavedData;
            let textoRelatorio = `*RELATÓRIO DE ATENDIMENTO AO CLIENTE (RAC)*\n\n` +
                `*INFORMAÇÕES*\n` +
                `Cliente: ${d.cliente}\n` +
                `Nº Chamado: ${d.num_chamado}\n` +
                `Data de abertura: ${d.data_abertura}\n` +
                `Data de atendimento: ${d.data_atendimento}\n` +
                `Horário de atendimento: ${d.horario_atendimento}\n\n` +
                `*ATENDIMENTO*\n` +
                `Responsável: ${d.responsavel}\n` +
                `Contato: ${d.contato_responsavel}\n` +
                `Modelo veículo: ${d.modelo_veiculos}\n` +
                `Nº Patrimônio: ${d.num_patrimonio}\n` +
                `Utilização: ${d.utilizacao}\n` +
                `Solicitação: ${d.solicitacao}\n\n` +
                `*OBSERVAÇÕES*\n` +
                `Saindo: ${d.veiculos_saindo} | Entrando: ${d.veiculos_entrando}\n` +
                `Obs: ${d.observacoes}\n\n` +
                `Colaborador: ${d.colaborador_brmobility}\n\n` +
                `*Fotos:* \n` + d.photos.join('\n');

            if (d.video) textoRelatorio += `\n*Vídeo:* ${d.video}`;

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRelatorio)}`, '_blank');
        }

        async function openSavedList() {
            showScreen('saved-screen');
            const container = document.getElementById('saved-list-container');
            container.innerHTML = "<p>Buscando fichas...</p>";

            try {
                const snapshot = await db.collection("fichas_rac").orderBy("createdAt", "desc").get();
                if (snapshot.empty) {
                    container.innerHTML = "<p>Nenhuma ficha salva.</p>";
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="saved-item">
                            <div>
                                <strong>Chamado:</strong> ${data.num_chamado} | <strong>Cliente:</strong> ${data.cliente}<br>
                                <small>Data: ${data.data_atendimento} - ${data.horario_atendimento}</small>
                            </div>
                            <button class="btn-action btn-save" style="padding: 5px 10px; font-size: 12px;" onclick='recarregarFicha(${JSON.stringify(data)})'>Visualizar</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = "<p>Erro ao carregar fichas do Firebase.</p>";
            }
        }

        function recarregarFicha(data) {
            currentSavedData = data;
            document.getElementById('cliente').value = data.cliente || '';
            document.getElementById('num_chamado').value = data.num_chamado || '';
            document.getElementById('data_abertura').value = data.data_abertura || '';
            document.getElementById('data_atendimento').value = data.data_atendimento || '';
            document.getElementById('horario_atendimento').value = data.horario_atendimento || '';
            document.getElementById('responsavel').value = data.responsavel || '';
            document.getElementById('contato_responsavel').value = data.contato_responsavel || '';
            document.getElementById('modelo_veiculos').value = data.modelo_veiculos || '';
            document.getElementById('num_patrimonio').value = data.num_patrimonio || '';
            
            if (data.utilizacao) {
                const radio = document.querySelector(`input[name="utilizacao"][value="${data.utilizacao}"]`);
                if (radio) radio.checked = true;
            }
            
            document.getElementById('solicitacao').value = data.solicitacao || '';
            document.getElementById('veiculos_saindo').value = data.veiculos_saindo || '';
            document.getElementById('veiculos_entrando').value = data.veiculos_entrando || '';
            document.getElementById('observacoes').value = data.observacoes || '';
            document.getElementById('colaborador_brmobility').value = data.colaborador_brmobility || '';

            if (data.assinatura_responsavel) {
                signatureDataUrl = data.assinatura_responsavel;
                const previewImg = document.getElementById('sig-preview-img');
                previewImg.src = signatureDataUrl;
                previewImg.style.display = 'block';
                document.getElementById('sig-placeholder-text').style.display = 'none';
            }

            showScreen('form-screen');
            document.getElementById('btn-whatsapp').style.display = 'inline-block';
        }
    </script>
